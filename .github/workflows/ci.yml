# Lunar AI CI Workflow
# Runs on every push and pull request to validate code quality and tests.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHON_VERSION: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CPU-compatible runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cpu.txt

      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Verify package can be installed in editable mode
        run: |
          python -m pip install -e .

      - name: Run Python syntax check
        run: |
          python -m py_compile src/lunar_lander_ai/*.py scripts/*.py

      - name: Run Ruff lint checks
        run: |
          python -m ruff check .

      - name: Run pytest
        run: |
          python -m pytest -v --tb=short

      - name: Run packaging smoke test (source-only)
        run: |
          python scripts/package_release.py /tmp/lunar-ai-source-test.zip --source-only
          echo "Source-only package created successfully"

      - name: Verify package contents
        run: |
          python -c "
import zipfile
with zipfile.ZipFile('/tmp/lunar-ai-source-test.zip', 'r') as z:
    names = z.namelist()
    print(f'Entries: {len(names)}')
    # Check core files exist
    required = [
      'LUNAR AI/README.md',
      'LUNAR AI/LICENSE',
      'LUNAR AI/pyproject.toml',
      'LUNAR AI/src/lunar_lander_ai/__init__.py',
      'LUNAR AI/tests/test_core.py',
    ]
    for req in required:
      if req not in names:
        print(f'MISSING: {req}')
        exit(1)
    print('All required core files present in package')
    # Ensure no excluded files
    for name in names:
      if any(bad in name for bad in ['.venv/', '__pycache__/', '.git/', '.zip', '.tmp']):
        print(f'UNEXPECTED FILE: {name}')
        exit(1)
    print('No excluded files found')
          "