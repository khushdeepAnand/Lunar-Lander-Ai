[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-lander-ai"
version = "0.2.0"
description = "A Deep Q-Network agent that learns to land a rocket in Gymnasium's LunarLander physics simulation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "Khushdeep Anand" }]
keywords = ["reinforcement-learning", "deep-q-network", "dqn", "gymnasium", "pytorch", "lunar-lander"]

# NOTE ON PYTHON VERSION
#   Upper bound is deliberate. Gymnasium's `box2d` extra resolves to the
#   prebuilt `Box2D == 2.3.10` wheel for CPython 3.10-3.13, but to the
#   source-only `box2d-py == 2.3.8` build on CPython 3.14. That build needs
#   SWIG plus MSVC Build Tools and fails on machines without a C++ toolchain.
#   See docs/BUILD_SPEC.md, "Environment risks".

# Canonical dependency ranges. requirements.txt pins the exact verified set
# that `pip install -r requirements.txt` uses; these ranges are what a
# downstream consumer of the package would need.
dependencies = [
    "gymnasium[box2d]>=1.2,<2",
    "torch>=2.6,<3",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pytest-cov>=5.0",
]
# Optional Phase 8 dashboard. Not required for the core project.
dashboard = [
    "streamlit>=1.57,<2",
    "plotly>=6,<7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff - linter and formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (likely bugs)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "D",   # pydocstyle (docstrings are a project requirement)
    "T20", # flake8-print (stray debug prints)
]
ignore = [
    "D203", # conflicts with D211; we use D211
    "D213", # conflicts with D212; we use D212
    "D100", # module docstrings not required for every tiny module
    "D104", # package __init__ docstrings not required
    "D107", # __init__ docstrings are redundant when the class docstring covers args
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]                      # tests are self-documenting; names carry the intent
"scripts/*" = ["T201"]                 # CLI entry points print to stdout by design
"src/lunar_lander_ai/train.py" = ["T201"]
"src/lunar_lander_ai/evaluate.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that run real training loops or open rendering windows",
]
